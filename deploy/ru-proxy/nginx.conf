# Обратный прокси для пользователей из РФ: vercel.app оттуда недоступен,
# а сервер в РФ до Vercel достаёт. Сам OpenRouter российские IP не пускает,
# поэтому прокси ходит в Vercel, а не в OpenRouter. TLS снаружи делает
# Traefik в Coolify, сюда приходит обычный HTTP.

# Из РФ новое TLS-соединение с Vercel иногда зависает на любом из его адресов
# (2026-10-30: 2 из 20 запросов не установили соединение ни с одним адресом).
# Поэтому соединения к Vercel держатся открытыми и переиспользуются, а новое
# открывается редко. `resolve` перечитывает адреса Vercel без перезапуска nginx
# (nginx 1.27.3+). Имя указано дважды, чтобы при неудаче было до четырёх попыток
# на двух адресах; max_fails=0 — сбой случаен и не повод выключать адрес.
upstream vercel {
    zone vercel 64k;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    server arni-backend.vercel.app:443 resolve max_fails=0;
    server arni-backend.vercel.app:443 resolve max_fails=0;
    keepalive 32;
    keepalive_timeout 120s;
    keepalive_requests 10000;
}

server {
    listen 80;
    server_name _;

    # Coolify проверяет здоровье контейнера этим путём.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://vercel;
        proxy_http_version 1.1;

        # Vercel маршрутизирует по SNI и Host.
        proxy_ssl_server_name on;
        proxy_ssl_name arni-backend.vercel.app;
        proxy_ssl_session_reuse on;
        proxy_set_header Host arni-backend.vercel.app;

        # Зависшее соединение бросаем через 4 с и пробуем снова. Повтор безопасен
        # и для POST: пока соединение и TLS не установлены, запрос не отправлен.
        proxy_connect_timeout 4s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 20s;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Ответы агента идут потоком (SSE): без буферизации и с длинным таймаутом.
        # Пустой Connection нужен и для keepalive к Vercel.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 20m;
    }
}

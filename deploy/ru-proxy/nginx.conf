# Обратный прокси для пользователей из РФ: vercel.app оттуда недоступен.
# Сам OpenRouter российские IP не пускает, поэтому прокси ходит в Vercel,
# а не в OpenRouter. TLS снаружи делает Traefik в Coolify, сюда приходит
# обычный HTTP.

# 2026-11-20: с хоста Coolify (46.161.48.175) DNS-имя arni-backend.vercel.app
# резолвится в 64.29.17.131 и 216.198.79.131, и до обоих соединение не
# устанавливается (timeout и host unreachable). GitHub из того же контейнера
# открывается. Из проверенных адресов Vercel отвечает только anycast
# 198.169.1.1 (сеть 198.169.1.0/24, Vercel, Inc). Адрес задан явно: SNI и Host
# остаются arni-backend.vercel.app. Соединения держатся открытыми и
# переиспользуются. Строка продублирована, чтобы при обрыве было до четырёх
# попыток; max_fails=0 — разовый сбой не повод выключать адрес.
# Если 198.169.1.1 перестанет отвечать, с этого же хоста проверить соседей
# 198.169.1.65, 198.169.1.129 и 198.169.1.193: снаружи они отдают этот проект.
upstream vercel {
    zone vercel 64k;
    server 198.169.1.1:443 max_fails=0;
    server 198.169.1.1:443 max_fails=0;
    keepalive 32;
    keepalive_timeout 120s;
    keepalive_requests 10000;
}

server {
    listen 80;
    server_name _;

    # Coolify проверяет здоровье контейнера этим путём.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://vercel;
        proxy_http_version 1.1;

        # Vercel маршрутизирует по SNI и Host.
        proxy_ssl_server_name on;
        proxy_ssl_name arni-backend.vercel.app;
        proxy_ssl_session_reuse on;
        proxy_set_header Host arni-backend.vercel.app;

        # Зависшее соединение бросаем через 4 с и пробуем снова. Повтор безопасен
        # и для POST: пока соединение и TLS не установлены, запрос не отправлен.
        proxy_connect_timeout 4s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 20s;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Ответы агента идут потоком (SSE): без буферизации и с длинным таймаутом.
        # Пустой Connection нужен и для keepalive к Vercel.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 20m;
    }
}

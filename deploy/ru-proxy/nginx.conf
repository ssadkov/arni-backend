# Обратный прокси для пользователей из РФ: vercel.app оттуда недоступен,
# а сервер в РФ до Vercel достаёт. Сам OpenRouter российские IP не пускает,
# поэтому прокси ходит в Vercel, а не в OpenRouter. TLS снаружи делает
# Traefik в Coolify, сюда приходит обычный HTTP.

server {
    listen 80;
    server_name _;

    # Coolify проверяет здоровье контейнера этим путём.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # IP-адреса Vercel меняются: адрес разрешается заново раз в 5 минут,
    # а не один раз при старте nginx.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $vercel https://arni-backend.vercel.app;

    location / {
        proxy_pass $vercel;
        proxy_http_version 1.1;

        # Vercel маршрутизирует по SNI и Host.
        proxy_ssl_server_name on;
        proxy_ssl_name arni-backend.vercel.app;
        proxy_set_header Host arni-backend.vercel.app;

        # Vercel отдаёт несколько адресов, и из РФ один из них временами не отвечает
        # (2026-10-30: 4 из 12 запросов висели больше 20 с, затем 502). Быстро бросаем
        # такой адрес и пробуем следующий. Повтор безопасен и для POST: запрос ещё
        # не отправлен, пока соединение и TLS не установлены.
        proxy_connect_timeout 4s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Ответы агента идут потоком (SSE): без буферизации и с длинным таймаутом.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 20m;
    }
}
